[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0", "cmake", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-graph"
version = "0.9.0"
description = "Impulse Graph Engine Python SDK & C++ Bytecode VM Binding"
authors = [
    { name = "Impulse Graph Team", email = "engineering@impulsegraph.io" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://docs.impulsegraph.io"
Repository = "https://github.com/impulse-graph/impulse-graph-core"
Documentation = "https://docs.impulsegraph.io"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

