[package]
name = "impulse-graph-tooling"
version = "0.9.0"
edition = "2021"
description = "Impulse Graph Engine Developer Utilities & Layout Optimizer Suite"
license = "Apache-2.0"

[lib]
name = "impulse_graph_tooling"
path = "src/lib.rs"

[[bin]]
name = "impulse-graph"
path = "src/main.rs"

[[bin]]
name = "generate-docs"
path = "src/bin/generate_docs.rs"

[dependencies]
impulse-graph = { path = "../impulse-rust" }
clap = { version = "4.4", features = ["derive"] }
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
zstd = "0.13"
comfy-table = "7.1"
indicatif = "0.17"
rayon = "1.8"
rand = "0.8"
safetensors = "0.4"
memmap2 = "0.9"
parquet = "53"
arrow-array = "53"
arrow-schema = "53"

