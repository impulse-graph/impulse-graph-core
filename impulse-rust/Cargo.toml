[package]
name = "impulse-graph"
version = "0.9.0"
edition = "2021"
description = "Impulse Graph Engine Core Crate (Spec v0.9.0)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
rayon = ["dep:rayon"]
tokio = ["dep:tokio"]

[dependencies]
rayon = { version = "1.8", optional = true }
tokio = { version = "1.30", optional = true }
