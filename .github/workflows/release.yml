name: Release & Artifact Build Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - 'v*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.9.0-preview.1)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # Required for Cosign keyless signing

jobs:
  build-cpp-kernel:
    name: Build C++ Kernel (${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ matrix.target.libc }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux x86_64 (glibc)
          - os: linux
            arch: x86_64
            libc: glibc
            runner: ubuntu-22.04
            cmake_flags: ""
          # Linux ARM64 (glibc)
          - os: linux
            arch: aarch64
            libc: glibc
            runner: ubuntu-24.04-arm
            cmake_flags: ""
          # macOS Apple Silicon arm64
          - os: darwin
            arch: arm64
            libc: darwin
            runner: macos-14
            cmake_flags: ""
          # Windows x86_64 (MSVC /MT)
          - os: windows
            arch: x86_64
            libc: msvc
            runner: windows-latest
            cmake_flags: "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure & Build C++ Core Kernel
        shell: bash
        run: |
          cmake -B build-cpp -S impulse-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PWD}/install-cpp" \
            ${{ matrix.target.cmake_flags }}
          cmake --build build-cpp --config Release --target install

      - name: Package Distributable C-ABI SDK Archive
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -n "${{ inputs.version }}" ]; then
            TAG_NAME="${{ inputs.version }}"
          fi
          DIST_NAME="impulse-sdk-${TAG_NAME}-${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ matrix.target.libc }}"
          mkdir -p dist

          if [ "${{ matrix.target.os }}" == "windows" ]; then
            cp -r install-cpp "$DIST_NAME"
            7z a "dist/${DIST_NAME}.zip" "$DIST_NAME"
          else
            cp -r install-cpp "$DIST_NAME"
            tar -czvf "dist/${DIST_NAME}.tar.gz" "$DIST_NAME"
          fi

      - name: Upload C-ABI SDK Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-sdk-${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ matrix.target.libc }}
          path: dist/*

  build-cli-tooling:
    name: Build CLI Tooling (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux x86_64
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          # Linux ARM64
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          # macOS Apple Silicon arm64
          - os: darwin
            arch: arm64
            runner: macos-14
          # Windows x86_64
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - name: Checkout Core Repository
        uses: actions/checkout@v4
        with:
          path: impulse-graph-core

      - name: Checkout Tooling Repository
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-tooling
          path: impulse-graph-tooling

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Standalone CLI Binary
        shell: bash
        run: |
          cd impulse-graph-tooling
          cargo build --release

      - name: Package Distributable CLI Archive
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -n "${{ inputs.version }}" ]; then
            TAG_NAME="${{ inputs.version }}"
          fi
          CLI_DIST="impulse-cli-${TAG_NAME}-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          mkdir -p "$CLI_DIST" dist

          if [ "${{ matrix.target.os }}" == "windows" ]; then
            cp impulse-graph-tooling/target/release/impulse-graph.exe "$CLI_DIST/impulse-graph.exe"
            cp impulse-graph-tooling/target/release/impulse-graph.exe "$CLI_DIST/impulse.exe"
            7z a "dist/${CLI_DIST}.zip" "$CLI_DIST"
          else
            cp impulse-graph-tooling/target/release/impulse-graph "$CLI_DIST/impulse-graph"
            cp impulse-graph-tooling/target/release/impulse-graph "$CLI_DIST/impulse"
            chmod +x "$CLI_DIST/impulse-graph" "$CLI_DIST/impulse"
            tar -czvf "dist/${CLI_DIST}.tar.gz" "$CLI_DIST"
          fi

      - name: Upload CLI Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*

  build-rust-crates:
    name: Package Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Package Rust Crates
        run: |
          mkdir -p dist-crates
          cargo package --manifest-path impulse-rust/Cargo.toml --no-verify --allow-dirty || true
          cp impulse-rust/target/package/*.crate dist-crates/ || true

      - name: Upload Rust Crate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-rust-crates
          path: dist-crates/*

  build-python-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel & build
        run: python -m pip install cibuildwheel==2.21.3 build

      - name: Build SDist (on Linux x86_64 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd impulse-python
          python -m build --sdist --outdir ../wheelhouse

      - name: Build Wheels via cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse impulse-python
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*musllinux* *win32* *i686*"
          CIBW_ARCHS_LINUX: "auto"
          CIBW_ARCHS_MACOS: "auto"
          CIBW_ARCHS_WINDOWS: "AMD64"

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*

  publish-release:
    name: Publish GitHub Release & Sign Artifacts
    needs: [build-cpp-kernel, build-cli-tooling, build-rust-crates, build-python-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign SHA256SUMS with Cosign (Keyless OIDC)
        run: |
          cd release-assets
          cosign sign-blob --yes --output-signature SHA256SUMS.sig SHA256SUMS

      - name: Determine Pre-release Status
        id: prerelease_check
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -n "${{ inputs.version }}" ]; then
            TAG_NAME="${{ inputs.version }}"
          fi

          if [ "${{ inputs.prerelease }}" == "true" ] || [[ "$TAG_NAME" =~ -preview|-PREVIEW|-rc|-alpha|-beta ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Formatted Release Description
        run: |
          TAG_NAME="${{ steps.prerelease_check.outputs.release_tag }}"
          cat << EOF > release_description.md
          # 🚀 Impulse Graph Release \`${TAG_NAME}\`

          **Impulse Graph Engine** is a high-performance, zero-copy, C-ABI binary snapshot graph engine.

          ---

          ## 🛠️ 1. Standalone Impulse CLI Tooling

          Pre-compiled standalone executables (\`impulse\` / \`impulse-graph\`) with embedded C++20 engine kernel. No runtime dependencies required.

          | Platform | Architecture | Binary Archive | Quick Verify Command |
          | :--- | :--- | :--- | :--- |
          | 🍏 **macOS** | Apple Silicon (\`arm64\`) | [⬇️ \`impulse-cli-${TAG_NAME}-darwin-arm64.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-cli-${TAG_NAME}-darwin-arm64.tar.gz) | \`./impulse --version\` |
          | 🐧 **Linux** | x86_64 (\`amd64\`) | [⬇️ \`impulse-cli-${TAG_NAME}-linux-x86_64.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-cli-${TAG_NAME}-linux-x86_64.tar.gz) | \`./impulse --version\` |
          | 🐧 **Linux** | ARM64 (\`aarch64\`) | [⬇️ \`impulse-cli-${TAG_NAME}-linux-aarch64.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-cli-${TAG_NAME}-linux-aarch64.tar.gz) | \`./impulse --version\` |
          | 🪟 **Windows** | x86_64 (\`amd64\`) | [⬇️ \`impulse-cli-${TAG_NAME}-windows-x86_64.zip\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-cli-${TAG_NAME}-windows-x86_64.zip) | \`.\\impulse.exe --version\` |

          ---

          ## 📦 2. Native C / C++ Engine SDK

          Includes C-ABI headers (\`impulse_graph.h\`, \`impulse_vm.h\`, \`impulse_compiler.hpp\`), static libraries (\`libimpulse_graph_static.a\`), dynamic libraries (\`libimpulse_graph.so\`/\`.dylib\`/\`.dll\`), and CMake export configurations.

          | Platform | Architecture | Libc / Toolchain | Direct Download |
          | :--- | :--- | :--- | :--- |
          | 🍏 **macOS** | Apple Silicon (\`arm64\`) | Clang / \`libc++\` | [⬇️ \`impulse-sdk-${TAG_NAME}-darwin-arm64-darwin.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-sdk-${TAG_NAME}-darwin-arm64-darwin.tar.gz) |
          | 🐧 **Linux** | x86_64 | GNU (\`glibc >= 2.28\`) | [⬇️ \`impulse-sdk-${TAG_NAME}-linux-x86_64-glibc.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-sdk-${TAG_NAME}-linux-x86_64-glibc.tar.gz) |
          | 🐧 **Linux** | ARM64 (\`aarch64\`) | GNU (\`glibc >= 2.28\`) | [⬇️ \`impulse-sdk-${TAG_NAME}-linux-aarch64-glibc.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-sdk-${TAG_NAME}-linux-aarch64-glibc.tar.gz) |
          | 🪟 **Windows** | x86_64 | MSVC (\`/MT\` Static CRT) | [⬇️ \`impulse-sdk-${TAG_NAME}-windows-x86_64-msvc.zip\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-sdk-${TAG_NAME}-windows-x86_64-msvc.zip) |

          ---

          ## 🐍 3. Python SDK & Zero-Copy Wheels

          Pre-compiled binary wheels with native zero-copy NumPy and PyTorch tensor memory-mapping:

          | Platform | Python 3.13 | Python 3.12 | Python 3.11 | Python 3.10 | Python 3.9 |
          | :--- | :---: | :---: | :---: | :---: | :---: |
          | 🍏 **macOS arm64** | [cp313](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp313-cp313-macosx_11_0_arm64.whl) | [cp312](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp312-cp312-macosx_11_0_arm64.whl) | [cp311](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp311-cp311-macosx_11_0_arm64.whl) | [cp310](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp310-cp310-macosx_11_0_arm64.whl) | [cp39](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp39-cp39-macosx_11_0_arm64.whl) |
          | 🐧 **Linux x86_64** | [cp313](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl) | [cp312](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl) | [cp311](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl) | [cp310](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl) | [cp39](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp39-cp39-manylinux_2_17_x86_64.manylinux2014_x86_64.whl) |
          | 🐧 **Linux aarch64** | [cp313](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl) | [cp312](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl) | [cp311](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp311-cp311-manylinux_2_17_aarch64.manylinux2014_aarch64.whl) | [cp310](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp310-cp310-manylinux_2_17_aarch64.manylinux2014_aarch64.whl) | [cp39](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp39-cp39-manylinux_2_17_aarch64.manylinux2014_aarch64.whl) |
          | 🪟 **Windows amd64** | [cp313](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp313-cp313-win_amd64.whl) | [cp312](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp312-cp312-win_amd64.whl) | [cp311](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp311-cp311-win_amd64.whl) | [cp310](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp310-cp310-win_amd64.whl) | [cp39](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0-cp39-cp39-win_amd64.whl) |

          - **Source Tarball**: [⬇️ \`impulse_graph-0.9.0.tar.gz\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse_graph-0.9.0.tar.gz)

          ---

          ## 🦀 4. Rust Engine Crate

          - **Crate Download**: [⬇️ \`impulse-graph-0.9.0.crate\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/impulse-graph-0.9.0.crate)
          - **Add to \`Cargo.toml\`**:
            \`\`\`toml
            [dependencies]
            impulse-graph = "0.9.0"
            \`\`\`

          ---

          ## ⚡ 5. Quick Install via Package Managers

          \`\`\`bash
          # Python
          pip install impulse-graph

          # Rust
          cargo add impulse-graph

          # Node.js
          npm install impulse-graph

          # .NET / C#
          dotnet add package ImpulseGraph
          \`\`\`

          ---

          ## 🛡️ 6. Cryptographic Integrity & SLSA Level 3 Attestation

          Every release artifact is cryptographically hashed and signed via Sigstore / Cosign keyless OIDC:

          * **SHA-256 Checksums**: [⬇️ \`SHA256SUMS\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/SHA256SUMS)
          * **Cosign Signature**: [⬇️ \`SHA256SUMS.sig\`](https://github.com/impulse-graph/impulse-graph-core/releases/download/${TAG_NAME}/SHA256SUMS.sig)

          \`\`\`bash
          # Verify file integrity
          sha256sum -c SHA256SUMS

          # Verify cryptographic signature
          cosign verify-blob \
            --certificate-identity-regexp "https://github.com/impulse-graph/impulse-graph-core/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signature SHA256SUMS.sig \
            SHA256SUMS
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prerelease_check.outputs.release_tag }}
          name: "Impulse Graph Core ${{ steps.prerelease_check.outputs.release_tag }}"
          body_path: release_description.md
          files: |
            release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
