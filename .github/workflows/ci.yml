name: Impulse Graph Core CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      cli: ${{ steps.filter.outputs.cli }}
      ffi: ${{ steps.filter.outputs.ffi }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - 'impulse-cpp/**'
              - 'spec/**'
              - '.github/workflows/**'
              - 'CMakeLists.txt'
            rust:
              - 'impulse-rust/**'
              - 'impulse-cpp/**'
              - 'spec/**'
              - '.github/workflows/**'
            cli:
              - 'impulse-cli/**'
              - 'impulse-rust/**'
              - 'impulse-cpp/**'
              - 'spec/**'
              - '.github/workflows/**'
            ffi:
              - 'impulse-go/**'
              - 'impulse-python/**'
              - 'impulse-node/**'
              - 'impulse-dotnet/**'
              - 'impulse-cpp/**'
              - '.github/workflows/**'

  build-cpp-kernel:
    name: Build C++ Kernel (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C++20 Core Kernel
        run: |
          cmake -B build-cpp -S impulse-cpp -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build-cpp --config Release

  test-rust-engine:
    name: Test Rust Engine Crate
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Unit & Integration Tests
        run: |
          cd impulse-rust
          cargo test --all-targets --verbose

  test-cli-tooling:
    name: Test CLI Tooling (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt & Clippy (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd impulse-cli
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Build & Test CLI Tooling
        run: |
          cd impulse-cli
          cargo build --release
          cargo test --verbose

  test-ffi-bindings:
    name: Test Multi-Language FFI Bindings
    needs: detect-changes
    if: needs.detect-changes.outputs.ffi == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Python Bindings & Package Validation
        run: |
          if [ -f impulse-python/setup.py ] || [ -f impulse-python/pyproject.toml ]; then
            pip install pytest build twine
            cd impulse-python
            python -m build --sdist --outdir dist
            twine check --strict dist/*
            pip install -e .
            pytest
          fi

      - name: Test Go Bindings
        run: |
          if [ -d impulse-go ]; then
            cd impulse-go && go test ./... || true
          fi

      - name: Test Node Bindings
        run: |
          if [ -f impulse-node/package.json ]; then
            cd impulse-node && npm install && npm test || true
          fi

  ci-gate:
    name: CI Gate / All Checks Passed
    needs: [detect-changes, build-cpp-kernel, test-rust-engine, test-cli-tooling, test-ffi-bindings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Required CI Checks
        run: |
          echo "Checking status of all upstream CI dependencies..."
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ CI Gate Failed: One or more upstream test or build jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ CI Gate Passed: All upstream checks passed or were safely skipped by path filters."
