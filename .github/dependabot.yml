          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/impulse-node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      node-minor-and-patch:
        patterns:
          - "*"
