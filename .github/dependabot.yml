version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/impulse-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/impulse-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cli-minor-and-patch:
