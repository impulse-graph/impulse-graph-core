          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/impulse-dotnet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
