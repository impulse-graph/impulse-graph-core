    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/impulse-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
